name: Deploy site to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_pDiWc3WB3QZPIjBXaO3ReDW1
  VERCEL_PROJECT_ID: prj_apQWSX2whm4v0usnmzL6zRe4HPJo
  VERCEL_SCOPE: ruikangwnemos-projects
  VERCEL_PROJECT: site
  VERCEL_CLI_VERSION: 59.11.2

jobs:
  deploy-production:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production configuration
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --scope="${VERCEL_SCOPE}" --project="${VERCEL_PROJECT}" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build with Vercel
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --scope="${VERCEL_SCOPE}" --project="${VERCEL_PROJECT}" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to production
        run: |
          deployment_url=$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --scope="${VERCEL_SCOPE}" --project="${VERCEL_PROJECT}" --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Production deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"
